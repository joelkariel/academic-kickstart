{{- define "main" -}}

{{ partial "page_header.html" . }}

<div class="universal-wrapper">
  <div class="row">
    <div class="col-lg-12">

      {{ with .Content }}
      <div class="article-style">{{ . }}</div>
      {{ end }}

      <ol class="publication-list pl-4">
        {{ range .Pages.ByDate.Reverse }}
        <li class="mb-3">
          {{ partial "functions/render_view" (dict "page" $ "item" . "view" ($.Params.view | default "citation")) }}
        </li>
        {{ end }}
      </ol>

    </div>
  </div>
</div>

{{- end -}}
